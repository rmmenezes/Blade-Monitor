[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blade-monitor"
version = "0.1.0"
description = "Monitor de exposição externa (External Attack Surface Monitoring)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
blade-monitor = "blade_monitor.cli:main"

[tool.setuptools]
packages = ["blade_monitor"]
